# Models for claude-or (see openrouter.zsh). Edit this file to swap a model; no reload needed, just restart claude-or.
#
# One model per line:  OpenRouter ID|Label shown in /model|Short description
#   - Order here is the order in the /model picker.
#   - The FIRST model is the one a session starts on (also used for background calls), so keep a cheap one first.
#   - Copy the exact ID from the model's page on openrouter.ai/models. Free models must end in :free.
#   - Do not use the | character or double quotes inside the label or description.
#   - Lines starting with # and blank lines are ignored.

# Paid
deepseek/deepseek-v4.1-flash-1017|DeepSeek V4.1 Flash|Paid, very cheap, everyday coding (starts here)
moonshotai/kimi-k2.7-code|Kimi K2.7 Code|Paid, cheap, built for code
z-ai/glm-5.3-flash|GLM 5.3 Flash|Paid, cheapest, light work

# Free (these come and go; a retired ID is hidden from the picker)
recursive/flint-v1.0:free|Flint (free)|Free, built for coding agents
nvidia/nemotron-3-ultra-550b-a55b:free|Nemotron 3 Ultra (free)|Free, 1M context
dots-studio/dots-3-note-preview:free|Dots3-Note (free)|Free, reasoning and coding, 512K
